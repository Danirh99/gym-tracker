# Nginx en frente de PHP-FPM para una API REST Symfony.
#
# Esto se incluye dentro del bloque http{} de /etc/nginx/nginx.conf (imagen oficial),
# asi que NO redefinimos directivas a nivel http como gzip o keepalive_timeout.
#
# Layout:
#   - /usr/share/nginx/html  -> copia de backend/public/ (assets, index.php, importmap.php)
#   - backend:9000           -> servicio PHP-FPM, que tiene la app real en /app
#
# Cualquier request no-estatico se manda a /index.php en el contenedor PHP-FPM
# (NO al de nginx), con SCRIPT_FILENAME apuntando a la ruta real /app/public/index.php.

server {
    listen      8000 default_server;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.php;

    # Tunning fino a nivel server (los http-level ya los trae nginx.conf)
    client_max_body_size  16m;
    client_body_buffer_size 128k;
    server_tokens         off;

    # Healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bloquea archivos ocultos (.git, .env, .htaccess, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Favicon y robots servidos tal cual
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Estaticos con cache agresivo (Symfony pone los assets con hash en el nombre)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|webp|avif|map|json|xml)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Front controller: cualquier ruta no-estatica va a index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Despacho FastCGI a PHP-FPM.
    # - `internal` lo hace accesible SOLO via internal redirect (try_files de location /)
    # - SCRIPT_FILENAME apunta a la ruta en el contenedor PHP, no en nginx
    location = /index.php {
        fastcgi_pass            backend:9000;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param           DOCUMENT_ROOT   /app/public;
        fastcgi_param           QUERY_STRING    $query_string;

        # Buffers y timeouts
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout    30s;
        fastcgi_connect_timeout 5s;

        # Hardening
        fastcgi_hide_header     X-Powered-By;
        fastcgi_param           HTTPS           $https if_not_empty;

        internal;
    }

    # Cualquier .php que no sea index.php: 404 directo
    location ~ \.php$ {
        return 404;
    }

    # Paginas de error pasadas al front controller de Symfony
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;
}
