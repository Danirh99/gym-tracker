; Production php.ini overrides
; Loaded via /usr/local/etc/php/conf.d/zz-app.ini (zz prefix = loaded last)

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

date.timezone = UTC
default_charset = "UTF-8"

; Symfony + Doctrine en operaciones normales: 128M es holgado.
; Las workers de FPM las arrancamos con un php.ini distinto si hace falta (php_admin_value).
memory_limit = 256M

; Realpath cache: enorme ganancia en apps con muchos archivos (Symfony/Doctrine)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Subidas razonables para una API REST (assets/avatar/etc.)
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 30
max_input_time = 30

; OPcache en produccion
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Evita info leaks
expose_php = Off
