; PHP-FPM pool tuned for a Symfony API behind nginx.
; Loaded as /usr/local/etc/php-fpm.d/zz-app.conf (zz prefix = loaded last, overrides www.conf defaults).

[www]

user  = www-data
group = www-data

listen       = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Las requests reales (incluidos healthchecks) llegan desde nginx en la red docker
; (mismo namespace o servicio "backend"), pero dejamos 127.0.0.1 como fallback.
; Si quieres permitir el proxy desde otros contenedores, usa la IP del gateway o "any".
; pm.process_idle_timeout deja workers ociosos morir tras 10s para no acumular RAM.
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500
pm.process_idle_timeout = 10s
pm.status_listen     = 127.0.0.1:9001

; Errores a stderr (los captura docker logs)
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Variables Symfony/Doctrine
env[APP_ENV]      = $APP_ENV
env[APP_SECRET]   = $APP_SECRET
env[DATABASE_URL] = $DATABASE_URL

; Por si Symfony usa estas
env[APP_DEBUG]            = $APP_DEBUG
env[SYMFONY_DEPRECATIONS_HELPER] = $SYMFONY_DEPRECATIONS_HELPER

; Endpoints lentos: API REST, no deberia necesitar mas de 30s
request_terminate_timeout = 30s

; Logging estilo docker
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

php_admin_value[memory_limit]        = 256M
php_admin_value[opcache.validate_timestamps] = 0
php_admin_flag[log_errors]           = on
php_admin_value[error_log]           = /proc/self/fd/2
