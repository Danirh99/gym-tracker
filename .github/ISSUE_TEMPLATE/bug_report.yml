name: Bug report
description: Reporta un error para ayudarnos a mejorar
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug.

  - type: textarea
    id: description
    attributes:
      label: Descripcion
      description: Que esta fallando exactamente?
      placeholder: Describe el problema con detalle
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a...
        2. Hacer click en...
        3. Ver error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      placeholder: Que deberia pasar?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Entorno
      description: SO, navegador y version de la app
      placeholder: macOS 15, Chrome 136, branch main
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Pega logs, stacktrace o imagenes
      render: shell
    validations:
      required: false
