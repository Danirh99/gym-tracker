services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: >
      sh -c "if [ -f package.json ]; then
        npm install && npm start -- --host 0.0.0.0 --port 4200;
      else
        echo 'Angular app not found. Create it with: docker compose run --rm frontend npx @angular/cli new gym-tracker --directory . --routing --style scss --skip-git --package-manager npm --defaults' && sleep infinity;
      fi"

  # Symfony + PHP-FPM. Ya no expone puerto al host: solo nginx lo ve por la red interna.
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: gym-tracker-backend:latest
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    expose:
      - "9000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8
      # Si la app usa DEFAULT_URI, pasala aqui desde el entorno del orquestador
      # DEFAULT_URI: ${DEFAULT_URI}
    depends_on:
      database:
        condition: service_healthy
    # En dev (con bind mount), reaprovechamos el vendor baked-in de la imagen
    # via el named volume, y re-instalamos con dev deps para tener bin/console, etc.
    # En prod, monta la imagen tal cual sin bind mount y este command se ignora.
    command: >
      sh -c "composer install --no-interaction --no-progress --optimize-autoloader && php-fpm"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx como reverse proxy + servidor de estaticos. Es el unico que publica puerto.
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: gym-tracker-nginx:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - database_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  frontend_node_modules:
  backend_vendor:
  database_data_postgres:
