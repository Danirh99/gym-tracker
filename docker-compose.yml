services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: >
      sh -c "if [ -f package.json ]; then
        npm install && npm start -- --host 0.0.0.0 --port 4200;
      else
        echo 'Angular app not found. Create it with: docker compose run --rm frontend npx @angular/cli new gym-tracker --directory . --routing --style scss --skip-git --package-manager npm --defaults' && sleep infinity;
      fi"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    ports:
      - "8001:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "if [ -f composer.json ]; then
        composer install && php -S 0.0.0.0:8000 -t public public/index.php;
      else
        echo 'Symfony app not found. Create it with: docker compose run --rm backend composer create-project symfony/skeleton . && docker compose run --rm backend composer require symfony/webapp-pack' && sleep infinity;
      fi"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - database_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  frontend_node_modules:
  backend_vendor:
  database_data_postgres:
