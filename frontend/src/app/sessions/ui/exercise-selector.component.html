<div class="grid grid-cols-1 gap-md">
  @for (exercise of exercises; track trackExercise($index, exercise)) {
    <button
      class="flex w-full items-center gap-md rounded-2xl border bg-surface-container-lowest p-md text-left shadow-[0_8px_24px_rgba(0,0,0,0.04)] transition-all hover:-translate-y-[2px] active:scale-[0.99]"
      [class.border-primary-container]="isSelected(exercise.id)"
      [class.ring-2]="isSelected(exercise.id)"
      [class.ring-primary-container]="isSelected(exercise.id)"
      (click)="selectExercise(exercise)"
      type="button"
    >
      <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-xl bg-surface-variant text-primary">
        <span class="material-symbols-outlined text-[30px]">{{ exercise.icon }}</span>
      </div>

      <div class="min-w-0 flex-1">
        <h3 class="truncate font-headline-md text-body-lg text-on-surface">{{ exercise.name }}</h3>
        @if (compactMeta) {
          <p class="mt-xs font-label-sm text-label-sm text-on-surface-variant">{{ exercise.typeLabel }} · {{ exercise.muscleGroups.join(', ') }}</p>
        } @else {
          <div class="mt-xs flex flex-wrap gap-xs">
            <span class="rounded-full bg-primary-container/15 px-3 py-0.5 font-label-sm text-label-sm text-on-primary-container">{{ exercise.typeLabel }}</span>
            <span class="rounded-full bg-secondary-container/15 px-3 py-0.5 font-label-sm text-label-sm text-secondary">{{ exercise.muscleGroups.join(', ') }}</span>
          </div>
        }
      </div>

      <span class="material-symbols-outlined" [class.text-primary]="isSelected(exercise.id)" [class.filled-icon]="isSelected(exercise.id)" [class.text-outline-variant]="!isSelected(exercise.id)">
        {{ isSelected(exercise.id) ? 'check_circle' : 'radio_button_unchecked' }}
      </span>
    </button>
  }

  @if (exercises.length === 0) {
    <p class="rounded-2xl border border-outline-variant bg-surface-container-lowest p-md text-center font-body-md text-body-md text-on-surface-variant">
      {{ emptyMessage }}
    </p>
  }
</div>
