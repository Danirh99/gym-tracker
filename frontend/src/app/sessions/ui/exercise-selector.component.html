<div
  class="grid grid-cols-1 gap-sm"
  [class.overflow-y-auto]="scrollable"
  [class.pr-1]="scrollable"
  [class.gap-md]="variant === 'card'"
  [style.max-height.px]="scrollable ? 320 : null"
  [ngClass]="variant === 'compact' ? 'md:grid-cols-2 md:gap-sm' : ''"
>
  @for (exercise of exercises; track trackExercise($index, exercise)) {
    <button
      class="flex w-full items-center border bg-surface-container-lowest text-left shadow-[0_8px_24px_rgba(0,0,0,0.04)] transition-all hover:-translate-y-[2px] hover:bg-surface-container-low active:scale-[0.99]"
      [class.gap-md]="variant === 'card'"
      [class.gap-sm]="variant === 'compact'"
      [class.rounded-2xl]="variant === 'card'"
      [class.rounded-xl]="variant === 'compact'"
      [class.p-md]="variant === 'card'"
      [class.p-3]="variant === 'compact'"
      [ngClass]="isSelected(exercise.id) ? 'bg-primary-container/10' : ''"
      [class.border-primary-container]="isSelected(exercise.id)"
      [class.border-outline-variant]="!isSelected(exercise.id)"
      [class.ring-2]="isSelected(exercise.id)"
      [class.ring-primary-container]="isSelected(exercise.id)"
      (click)="selectExercise(exercise)"
      type="button"
    >
      <div
        class="flex shrink-0 items-center justify-center rounded-xl bg-surface-variant text-primary"
        [class.h-16]="variant === 'card'"
        [class.w-16]="variant === 'card'"
        [class.h-10]="variant === 'compact'"
        [class.w-10]="variant === 'compact'"
      >
        <span
          class="material-symbols-outlined"
          [class.text-[30px]]="variant === 'card'"
          [class.text-[22px]]="variant === 'compact'"
        >{{ exercise.icon }}</span>
      </div>

      <div class="min-w-0 flex-1">
        <h3
          class="truncate font-headline-md text-on-surface"
          [class.text-body-lg]="variant === 'card'"
          [class.text-[15px]]="variant === 'compact'"
        >{{ exercise.name }}</h3>
        @if (compactMeta || variant === 'compact') {
          <p class="mt-0.5 truncate font-label-sm text-label-sm text-on-surface-variant">{{ exercise.typeLabel }} · {{ exercise.muscleGroups.join(', ') }}</p>
        } @else {
          <div class="mt-xs flex flex-wrap gap-xs">
            <span class="rounded-full bg-primary-container/15 px-3 py-0.5 font-label-sm text-label-sm text-on-primary-container">{{ exercise.typeLabel }}</span>
            <span class="rounded-full bg-secondary-container/15 px-3 py-0.5 font-label-sm text-label-sm text-secondary">{{ exercise.muscleGroups.join(', ') }}</span>
          </div>
        }
      </div>

      <span class="material-symbols-outlined shrink-0" [class.text-primary]="isSelected(exercise.id)" [class.filled-icon]="isSelected(exercise.id)" [class.text-outline-variant]="!isSelected(exercise.id)">
        {{ isSelected(exercise.id) ? 'check_circle' : 'radio_button_unchecked' }}
      </span>
    </button>
  }

  @if (exercises.length === 0) {
    <p class="rounded-2xl border border-outline-variant bg-surface-container-lowest p-md text-center font-body-md text-body-md text-on-surface-variant">
      {{ emptyMessage }}
    </p>
  }
</div>
