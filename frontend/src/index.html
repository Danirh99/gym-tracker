<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Gym Tracker - Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
    <link rel="icon" type="image/png" href="icons/favicon-32x32.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <main class="app-boot-splash" aria-label="Cargando Gym Tracker">
        <div class="app-boot-splash__halo" aria-hidden="true"></div>
        <section class="app-boot-splash__card">
          <img class="app-boot-splash__logo" src="icons/icon-maskable-512x512.png" alt="" width="96" height="96" />
          <p class="app-boot-splash__eyebrow">PWA offline-ready</p>
          <h1>Gym Tracker</h1>
          <p class="app-boot-splash__copy">Preparando tu entrenamiento...</p>
          <span class="app-boot-splash__loader" aria-hidden="true"></span>
        </section>
      </main>
    </app-root>
  </body>
</html>
